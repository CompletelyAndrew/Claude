<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QR Codes</title>
  <meta name="description" content="Learn how QR codes work until you can read one like a book cover, then keep it as your scanner and maker.">
  <meta name="theme-color" content="#17191c">
  <link rel="icon" href="assets/qr-icon.svg" type="image/svg+xml">
  <link rel="manifest" href="qr.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <!-- build:css -->
  <link rel="stylesheet" href="css/bench.css">
  <!-- /build:css -->
</head>
<body>
  <div id="app"><noscript>QR Codes needs JavaScript to run.</noscript></div>

  <!-- The QR module on its own: same files as in Bench, a one-module shell instead of app.js -->
  <!-- build:js -->
  <script src="js/core/ledger.js"></script>
  <script src="js/core/qr.js"></script>
  <script src="js/core/qrscan.js"></script>
  <script src="js/core/qrpayload.js"></script>
  <script src="js/core/qrlearn.js"></script>
  <script src="js/core/kit.js"></script>
  <script src="js/solo.js"></script>
  <script src="js/modules/qr.js"></script>
  <!-- /build:js -->
  <script>Bench.startSolo('qr', { tagline: 'learn it, then use it', mark: '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="var(--ink)"/><g fill="none" stroke="var(--paper)" stroke-width="2"><rect x="6" y="6" width="7" height="7" rx="1"/><rect x="19" y="6" width="7" height="7" rx="1"/><rect x="6" y="19" width="7" height="7" rx="1"/></g><rect x="19" y="19" width="7" height="7" rx="1.5" fill="var(--mark)"/></svg>' });</script>
</body>
</html>
