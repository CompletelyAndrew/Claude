/* css/bench.css */
/* Bench · brand + components
 * Layout concept: a workbench. A quiet rail of drawers on the left, one
 * working surface on the right laid on faint graph paper. One loud thing:
 * a highlighter yellow that marks what matters right now.
 */
:root {
  --paper: #f1f2ee;      /* graph-paper ground, a hair green */
  --surface: #fbfbf8;    /* sheets laid on the bench */
  --sunken: #e7e9e3;
  --ink: #17191c;
  --ink-2: #4b525a;
  --ink-3: #7b828a;
  --line: #d9dcd5;
  --line-2: #c6cac2;
  --grid: rgba(23, 25, 28, 0.045);
  --mark: #f5cf3d;       /* highlighter */
  --mark-soft: #f9e7a3;
  --mark-ink: #17191c;
  --blue: #2449c7;       /* ballpoint */
  --blue-soft: #dfe6fb;
  --good: #2f7d4f;
  --good-soft: #dcefe2;
  --warn: #b0670b;
  --warn-soft: #f6e6cc;
  --bad: #b8322a;
  --bad-soft: #f5dcd9;
  --shadow: 0 1px 0 rgba(23,25,28,.04), 0 6px 20px -12px rgba(23,25,28,.25);
  /* A QR symbol stays dark-on-light in every theme so phones can scan it off the screen */
  --qr-on: #111315;
  --qr-off: #ffffff;

  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Hanken Grotesk", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --t-xs: .75rem; --t-sm: .8125rem; --t-md: .9375rem; --t-lg: 1.125rem; --t-xl: 1.5rem; --t-2xl: 2.125rem; --t-3xl: 3rem;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --rail: 232px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121416; --surface: #1a1d20; --sunken: #0d0f10;
    --ink: #eceee8; --ink-2: #b2b8bd; --ink-3: #80878e;
    --line: #2a2e32; --line-2: #3a3f44; --grid: rgba(236,238,232,.035);
    --mark: #f5cf3d; --mark-soft: #4a3f17; --mark-ink: #17191c;
    --blue: #8aa6ff; --blue-soft: #1f2a4d;
    --good: #6cc495; --good-soft: #193a28; --warn: #e8a64a; --warn-soft: #3d2c12; --bad: #f08a80; --bad-soft: #43201d;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121416; --surface: #1a1d20; --sunken: #0d0f10;
  --ink: #eceee8; --ink-2: #b2b8bd; --ink-3: #80878e;
  --line: #2a2e32; --line-2: #3a3f44; --grid: rgba(236,238,232,.035);
  --mark: #f5cf3d; --mark-soft: #4a3f17; --mark-ink: #17191c;
  --blue: #8aa6ff; --blue-soft: #1f2a4d;
  --good: #6cc495; --good-soft: #193a28; --warn: #e8a64a; --warn-soft: #3d2c12; --bad: #f08a80; --bad-soft: #43201d;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 var(--t-md)/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--mark); color: var(--mark-ink); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
a { color: var(--blue); text-underline-offset: 3px; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.015em; }
p { margin: 0; }
code, kbd, pre, .mono { font-family: var(--f-mono); font-size: .9em; }
kbd {
  font-size: .72rem; padding: 1px 5px; border: 1px solid var(--line-2); border-bottom-width: 2px;
  border-radius: 4px; color: var(--ink-2); background: var(--surface);
}
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.eyebrow { font: 600 var(--t-xs)/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.marked { background: linear-gradient(transparent 58%, var(--mark) 58%, var(--mark) 92%, transparent 92%); padding: 0 .1em; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); height: 100%; }
.rail {
  border-right: 1px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; gap: 4px; padding: 18px 12px; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; color: var(--ink); text-decoration: none; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand b { font: 800 1.35rem/1 var(--f-display); letter-spacing: -0.03em; }
.brand small { display: block; font: 500 var(--t-xs)/1.2 var(--f-mono); color: var(--ink-3); letter-spacing: .02em; margin-top: 3px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-group { margin: 14px 8px 4px; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r-sm);
  color: var(--ink-2); text-decoration: none; font-weight: 500;
}
.nav a svg { width: 18px; height: 18px; flex: none; }
.nav a:hover { background: var(--sunken); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--paper); }
.nav a[aria-current="page"] .count { color: var(--paper); opacity: .7; }
.nav .count { margin-left: auto; font: 500 var(--t-xs) var(--f-mono); color: var(--ink-3); }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px 8px 0; border-top: 1px solid var(--line); }
.search-btn {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--paper); color: var(--ink-3); font: inherit; cursor: pointer; text-align: left;
}
.search-btn:hover { border-color: var(--line-2); color: var(--ink-2); }
.search-btn kbd { margin-left: auto; }

.main {
  overflow-y: auto; min-width: 0;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
.page { max-width: 1180px; margin: 0 auto; padding: 28px 32px 64px; display: flex; flex-direction: column; gap: 22px; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: var(--t-2xl); font-weight: 750; line-height: 1.1; }
.page-head .eyebrow { margin-bottom: 6px; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Surfaces ---------- */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); min-width: 0; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sheet-head h2 { font-size: var(--t-lg); font-weight: 650; }
.sheet-head .actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.sheet-body { padding: 16px 18px; }
.grid { display: grid; gap: 18px; }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols-main { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }
.empty { padding: 28px 18px; text-align: center; color: var(--ink-3); }
.empty b { display: block; color: var(--ink-2); font-family: var(--f-display); font-size: var(--t-lg); margin-bottom: 4px; }

/* ---------- Controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: 600 var(--t-sm)/1 var(--f-body); padding: 9px 13px; border-radius: var(--r-sm);
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap;
  transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover { background: var(--sunken); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--mark); border-color: var(--mark); color: var(--mark-ink); }
.btn.primary:hover { filter: brightness(.96); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--sunken); color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 9px; font-size: var(--t-xs); }
.btn.icon { padding: 7px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font: 600 var(--t-xs)/1.2 var(--f-mono); color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
.input, select.input, textarea.input {
  width: 100%; font: 400 var(--t-md)/1.4 var(--f-body); color: var(--ink);
  background: var(--paper); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 8px 10px;
}
textarea.input { resize: vertical; min-height: 90px; }
.input.mono, textarea.mono { font-family: var(--f-mono); font-size: var(--t-sm); }
.input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
input[type="color"].swatch-input { width: 40px; height: 36px; padding: 2px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--paper); cursor: pointer; }
input[type="range"] { accent-color: var(--ink); width: 100%; }
input[type="checkbox"] { accent-color: var(--ink); }

.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--sunken); border-radius: var(--r-sm); flex-wrap: wrap; }
.seg button {
  font: 600 var(--t-sm)/1 var(--f-body); border: 0; background: transparent; color: var(--ink-2);
  padding: 7px 11px; border-radius: 5px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px;
  font: 600 var(--t-xs)/1.5 var(--f-mono); background: var(--sunken); color: var(--ink-2); white-space: nowrap;
}
.chip.mark { background: var(--mark-soft); color: var(--ink); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.blue { background: var(--blue-soft); color: var(--blue); }
.sample-tag { font: 600 10px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); border: 1px dashed var(--line-2); border-radius: 4px; padding: 3px 5px; }

/* Stat line */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; }
.stat { padding: 14px 18px; border-right: 1px solid var(--line); min-width: 0; }
.stat:last-child { border-right: 0; }
.stat .v { font: 700 var(--t-xl)/1.15 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; margin-top: 4px; }
.stat .d { font-size: var(--t-xs); color: var(--ink-3); margin-top: 2px; }

/* Lists */
.list { list-style: none; margin: 0; padding: 0; }
.list > li { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-top: 1px solid var(--line); min-width: 0; }
.list > li:first-child { border-top: 0; }
.list .grow { flex: 1; min-width: 0; }
.list .title { overflow-wrap: anywhere; }
.list .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; font-size: var(--t-xs); color: var(--ink-3); align-items: center; }

.check {
  appearance: none; -webkit-appearance: none; flex: none; width: 18px; height: 18px; margin: 0;
  border: 1.5px solid var(--ink-3); border-radius: 5px; cursor: pointer; display: grid; place-items: center; background: var(--surface);
}
.check:checked { background: var(--ink); border-color: var(--ink); }
.check:checked::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--paper); border-bottom: 2px solid var(--paper); transform: rotate(-45deg) translate(1px, -1px); }
.pri { width: 3px; align-self: stretch; border-radius: 2px; flex: none; background: transparent; }
.pri.p1 { background: var(--line-2); } .pri.p2 { background: var(--warn); } .pri.p3 { background: var(--bad); }
li.is-done .title { text-decoration: line-through; color: var(--ink-3); }

/* Tables */
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
table.data th { text-align: left; font: 600 var(--t-xs)/1.2 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); padding: 10px 18px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data td { padding: 9px 18px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data td.amt, table.data th.amt { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--f-mono); }
.pos { color: var(--good); }

/* Meter */
.meter { height: 6px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--ink); border-radius: 99px; }
.meter.near > i { background: var(--warn); }
.meter.over > i { background: var(--bad); }

/* Charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-3); font: 500 11px var(--f-mono); }
.chart .gridline { stroke: var(--line); stroke-width: 1; }
.chart .bar-in { fill: var(--ink); }
.chart .bar-out { fill: var(--mark); }
.legend { display: flex; gap: 14px; font-size: var(--t-xs); color: var(--ink-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* Tabs inside a module */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button {
  border: 0; background: none; font: 600 var(--t-sm)/1 var(--f-body); color: var(--ink-3);
  padding: 10px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; white-space: nowrap;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

/* Markdown */
.prose { line-height: 1.65; max-width: 68ch; overflow-wrap: anywhere; }
.prose > * + * { margin-top: .8em; }
.prose h1 { font-size: var(--t-2xl); } .prose h2 { font-size: var(--t-xl); margin-top: 1.3em; } .prose h3 { font-size: var(--t-lg); margin-top: 1.1em; }
.prose ul, .prose ol { padding-left: 1.3em; margin-bottom: 0; }
.prose li + li { margin-top: .25em; }
.prose li.task { list-style: none; margin-left: -1.3em; display: flex; gap: 8px; align-items: baseline; }
.prose li.task .box { width: 13px; height: 13px; border: 1.5px solid var(--ink-3); border-radius: 3px; flex: none; transform: translateY(2px); }
.prose li.task.done .box { background: var(--ink); border-color: var(--ink); }
.prose li.task.done { color: var(--ink-3); text-decoration: line-through; }
.prose code { background: var(--sunken); padding: 1px 5px; border-radius: 4px; }
.prose pre { background: var(--sunken); padding: 12px 14px; border-radius: var(--r-md); overflow-x: auto; position: relative; }
.prose pre code { background: none; padding: 0; }
.prose pre[data-lang]::after { content: attr(data-lang); position: absolute; top: 6px; right: 10px; font: 600 10px var(--f-mono); color: var(--ink-3); text-transform: uppercase; }
.prose blockquote { margin-left: 0; padding-left: 14px; border-left: 3px solid var(--mark); color: var(--ink-2); }
.prose mark { background: var(--mark); color: var(--mark-ink); padding: 0 .15em; }
.prose hr { border: 0; border-top: 1px solid var(--line); }
.prose .md-table { overflow-x: auto; }
.prose table { border-collapse: collapse; font-size: var(--t-sm); }
.prose th, .prose td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; }
.prose a.wikilink { color: var(--ink); text-decoration: none; background: var(--mark-soft); border-radius: 3px; padding: 0 3px; }

/* Command palette */
.overlay { position: fixed; inset: 0; background: rgba(10,12,14,.38); display: flex; align-items: flex-start; justify-content: center; padding: 12vh 16px 16px; z-index: 50; }
.palette { width: min(620px, 100%); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); overflow: hidden; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); font: 500 var(--t-lg) var(--f-body); padding: 16px 18px; outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow-y: auto; }
.palette li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--r-sm); cursor: pointer; }
.palette li svg { width: 16px; height: 16px; color: var(--ink-3); flex: none; }
.palette li .hint { margin-left: auto; font: 500 var(--t-xs) var(--f-mono); color: var(--ink-3); }
.palette li[aria-selected="true"] { background: var(--mark-soft); }
.palette .palette-foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: var(--t-xs); color: var(--ink-3); flex-wrap: wrap; }

/* Toast */
.toasts { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: var(--r-md); font-size: var(--t-sm); font-weight: 500; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; animation: toast-in .18s ease-out; }
.toast button { background: none; border: 0; color: var(--mark); font: 600 var(--t-sm) var(--f-body); cursor: pointer; padding: 0; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }

/* Dialog-ish inline confirm */
.confirm { display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: var(--bad-soft); color: var(--bad); border-radius: var(--r-md); font-size: var(--t-sm); flex-wrap: wrap; }

/* Mobile */
.mobile-bar { display: none; }
@media (max-width: 860px) {

    [0, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],

    [0, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81],
  ];

  const MODES = {
    numeric: { bits: 0x1, count: [10, 12, 14] },
    alnum: { bits: 0x2, count: [9, 11, 13] },
    byte: { bits: 0x4, count: [8, 16, 16] },
    kanji: { bits: 0x8, count: [8, 10, 12] },
    eci: { bits: 0x7 },
  };
  const ALNUM = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';
  const countBits = (mode, version) => MODES[mode].count[version <= 9 ? 0 : version <= 26 ? 1 : 2];

  // Module roles, in the order lessons introduce them
  const ROLE = { data: 0, finder: 1, separator: 2, timing: 3, alignment: 4, format: 5, version: 6, dark: 7, remainder: 8 };
  const ROLE_NAMES = Object.keys(ROLE);

  const sizeOf = v => v * 4 + 17;
  const versionOf = size => (size - 17) / 4;

  function rawDataModules(v) {
    let n = (16 * v + 128) * v + 64;
    if (v >= 2) {
      const a = Math.floor(v / 7) + 2;
      n -= (25 * a - 10) * a - 55;
      if (v >= 7) n -= 36;
    }
    return n;
  }
  const totalCodewords = v => Math.floor(rawDataModules(v) / 8);
  const dataCodewords = (v, ec) => totalCodewords(v) - ECC_PER_BLOCK[EC[ec].ord][v] * NUM_BLOCKS[EC[ec].ord][v];

  function blockLayout(v, ec) {
    const o = EC[ec].ord;
    const n = NUM_BLOCKS[o][v], ecc = ECC_PER_BLOCK[o][v], total = totalCodewords(v);
    const shortLen = Math.floor(total / n), numShort = n - (total % n);
    const blocks = [];
    for (let i = 0; i < n; i++) blocks.push({ data: shortLen - ecc + (i < numShort ? 0 : 1), ecc });
    return blocks;
  }

  function alignmentPositions(v) {
    if (v === 1) return [];
    const n = Math.floor(v / 7) + 2;
    const step = Math.floor((v * 8 + n * 3 + 5) / (n * 4 - 4)) * 2;
    const out = [6];
    for (let pos = sizeOf(v) - 7; out.length < n; pos -= step) out.splice(1, 0, pos);
    return out;
  }

  // ---- GF(256) and Reed–Solomon ------------------------------------------------------
  const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  for (let i = 0, x = 1; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  const mul = (a, b) => (a && b ? EXP[LOG[a] + LOG[b]] : 0);
  const div = (a, b) => { if (!b) throw new Error('divide by zero'); return a ? EXP[(LOG[a] + 255 - LOG[b]) % 255] : 0; };

  // Generator with roots α^0 … α^(n-1), highest degree first, leading 1 dropped
  const genCache = {};
  function generator(n) {
    if (genCache[n]) return genCache[n];
    let g = [1];
    for (let i = 0; i < n; i++) {
      const next = new Array(g.length + 1).fill(0);
      for (let j = 0; j < g.length; j++) { next[j] ^= g[j]; next[j + 1] ^= mul(g[j], EXP[i]); }
      g = next;
    }
    return (genCache[n] = g.slice(1));
  }

  function rsEncode(data, n) {
    const g = generator(n), rem = new Array(n).fill(0);
    for (const b of data) {
      const f = b ^ rem.shift();
      rem.push(0);
      for (let i = 0; i < n; i++) rem[i] ^= mul(g[i], f);
    }
    return rem;
  }

  // Correct a whole block (data + ecc) in place. Returns positions fixed, or null if past repair.
  function rsCorrect(block, n) {
    const N = block.length;
    const S = [];
    let clean = true;
    for (let j = 0; j < n; j++) {
      let s = 0;
      for (let k = 0; k < N; k++) s = mul(s, EXP[j]) ^ block[k];
      S.push(s);
      if (s) clean = false;
    }
    if (clean) return [];
    // Berlekamp–Massey → error locator Λ (lowest degree first)
    let C = [1], B = [1], L = 0, m = 1, b = 1;
    for (let i = 0; i < n; i++) {
      let d = S[i];
      for (let k = 1; k <= L; k++) d ^= mul(C[k] || 0, S[i - k]);
      if (d === 0) { m++; continue; }
      const coef = div(d, b), T = C.slice();
      const len = Math.max(C.length, B.length + m);
      while (C.length < len) C.push(0);
      for (let k = 0; k < B.length; k++) C[k + m] ^= mul(coef, B[k]);
      if (2 * L <= i) { L = i + 1 - L; B = T; b = d; m = 1; } else m++;
    }
    if (L * 2 > n) return null;
    const evalAt = (p, x) => { let y = 0; for (let k = p.length - 1; k >= 0; k--) y = mul(y, x) ^ p[k]; return y; };
    // Ω = S·Λ mod x^n
    const omega = new Array(n).fill(0);
    for (let i = 0; i < n; i++) for (let k = 0; k <= i && k < C.length; k++) omega[i] ^= mul(C[k], S[i - k]);
    const deriv = C.map((c, k) => (k % 2 ? c : 0)).slice(1);
    const fixed = [];
    for (let p = 0; p < N; p++) {
      const xInv = EXP[(255 - p) % 255];
      if (evalAt(C, xInv) !== 0) continue;
      const den = evalAt(deriv, xInv);
      if (!den) return null;
      const e = mul(EXP[p], div(evalAt(omega, xInv), den));
      const k = N - 1 - p;
      block[k] ^= e;
      fixed.push(k);
    }
    if (fixed.length !== L) return null;
    return fixed.sort((a, z) => a - z);
  }

  // ---- BCH: format and version information -------------------------------------------
  function formatBits(ec, mask) {
    const data = (EC[ec].bits << 3) | mask;
    let rem = data;
    for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    return ((data << 10) | rem) ^ 0x5412;
  }
  function versionBits(v) {
    let rem = v;
    for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
    return (v << 12) | rem;
  }
  const popcount = x => { let c = 0; while (x) { c += x & 1; x >>>= 1; } return c; };
  function readFormat(bits) {
    let best = null;
    for (const ec of 'LMQH') for (let mask = 0; mask < 8; mask++) {
      const d = popcount(bits ^ formatBits(ec, mask));
      if (!best || d < best.distance) best = { ec, mask, distance: d };
    }
    return best.distance <= 3 ? best : null;
  }

  // ---- Masks ---------------------------------------------------------------------------
  const MASKS = [
    (x, y) => (x + y) % 2 === 0,
    (x, y) => y % 2 === 0,
    (x, y) => x % 3 === 0,
    (x, y) => (x + y) % 3 === 0,
    (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
    (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
    (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0,
    (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0,
  ];
  const MASK_FORMULAS = ['(x + y) mod 2 = 0', 'y mod 2 = 0', 'x mod 3 = 0', '(x + y) mod 3 = 0', '(⌊x/3⌋ + ⌊y/2⌋) mod 2 = 0', 'xy mod 2 + xy mod 3 = 0', '(xy mod 2 + xy mod 3) mod 2 = 0', '((x + y) mod 2 + xy mod 3) mod 2 = 0'];

  // ---- The empty grid: function patterns and roles -----------------------------------------
  // Matrix layout: modules[y * size + x], 1 = dark.
  function skeleton(v) {
    const size = sizeOf(v), n = size * size;
    const modules = new Uint8Array(n), role = new Uint8Array(n), fn = new Uint8Array(n);
    const set = (x, y, dark, r) => { const i = y * size + x; modules[i] = dark ? 1 : 0; role[i] = r; fn[i] = 1; };
    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0, ROLE.timing); set(i, 6, i % 2 === 0, ROLE.timing); }
    for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]]) {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const x = cx + dx, y = cy + dy;
        if (x < 0 || y < 0 || x >= size || y >= size) continue;
        const d = Math.max(Math.abs(dx), Math.abs(dy));
        set(x, y, d !== 2 && d !== 4, d === 4 ? ROLE.separator : ROLE.finder);
      }
    }
    const align = alignmentPositions(v), last = align.length - 1;
    for (let i = 0; i <= last; i++) for (let j = 0; j <= last; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === last) || (i === last && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
        set(align[i] + dx, align[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1, ROLE.alignment);
    }
    // Reserve format areas (filled later), the always-dark module, and version blocks
    for (const [x, y] of formatPositions(size).flat()) set(x, y, false, ROLE.format);
    set(8, size - 8, true, ROLE.dark);
    if (v >= 7) {
      const vb = versionBits(v);
      for (let i = 0; i < 18; i++) {
        const bit = (vb >>> i) & 1, a = size - 11 + (i % 3), b = Math.floor(i / 3);
        set(a, b, bit, ROLE.version); set(b, a, bit, ROLE.version);
      }
    }
    return { version: v, size, modules, role, fn };
  }

  // Where format bit i (0 = least significant) lives, for both copies
  function formatPositions(size) {
    const a = [], b = [];
    for (let i = 0; i <= 5; i++) a.push([8, i]);
    a.push([8, 7], [8, 8], [7, 8]);
    for (let i = 9; i < 15; i++) a.push([14 - i, 8]);
    for (let i = 0; i < 8; i++) b.push([size - 1 - i, 8]);
    for (let i = 8; i < 15; i++) b.push([8, size - 15 + i]);
    return [a, b];
  }

  // Data modules in placement order: two-column zig-zag from the bottom right
  function placementOrder(sk) {
    const { size, fn } = sk, out = [];
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      const upward = ((right + 1) & 2) === 0;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, y = upward ? size - 1 - vert : vert;
        if (!fn[y * size + x]) out.push(y * size + x);
      }
    }
    return out;
  }

  function writeFormat(sk, ec, mask) {
    const bits = formatBits(ec, mask);
    for (const copy of formatPositions(sk.size)) copy.forEach(([x, y], i) => { sk.modules[y * sk.size + x] = (bits >>> i) & 1; });
  }

  function applyMask(sk, mask) {
    const { size, modules, fn } = sk, f = MASKS[mask];
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const i = y * size + x;
      if (!fn[i] && f(x, y)) modules[i] ^= 1;
    }
  }

  // ---- Penalty (ISO 18004 §7.8.3) ------------------------------------------------------------
  function penalty(modules, size) {
    const at = (x, y) => modules[y * size + x];
    let n1 = 0, n2 = 0, n3 = 0, dark = 0;
    const PAT = [1, 0, 1, 1, 1, 0, 1];
    for (let pass = 0; pass < 2; pass++) {
      for (let a = 0; a < size; a++) {
        let run = 1;
        const line = [];
        for (let b = 0; b < size; b++) line.push(pass ? at(a, b) : at(b, a));
        for (let b = 1; b <= size; b++) {
          if (b < size && line[b] === line[b - 1]) run++;
          else { if (run >= 5) n1 += 3 + run - 5; run = 1; }
        }
        // Finder-like 1:1:3:1:1 with four light modules on either side (outside the grid counts as light)
        for (let b = -4; b < size; b++) {
          const get = k => (k < 0 || k >= size ? 0 : line[k]);
          let match = true;
          for (let k = 0; k < 7 && match; k++) if (get(b + k) !== PAT[k]) match = false;
          if (!match) continue;
          const lightBefore = [1, 2, 3, 4].every(k => get(b - k) === 0);
          const lightAfter = [7, 8, 9, 10].every(k => get(b + k) === 0);
          if (lightBefore) n3 += 40;
          if (lightAfter) n3 += 40;
        }
      }
    }
    for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
      const c = at(x, y);
      if (c === at(x + 1, y) && c === at(x, y + 1) && c === at(x + 1, y + 1)) n2 += 3;
    }
    for (let i = 0; i < modules.length; i++) dark += modules[i];
    const pct = (dark * 100) / modules.length;
    const n4 = Math.floor(Math.abs(pct - 50) / 5) * 10;
    return { total: n1 + n2 + n3 + n4, runs: n1, blocks: n2, finderLike: n3, balance: n4, darkPct: pct };
  }

  // ---- Segments ----------------------------------------------------------------------------------
  const utf8 = s => Array.from(new TextEncoder().encode(s));
  function bestMode(text) {
    if (/^[0-9]*$/.test(text)) return 'numeric';
    if ([...text].every(c => ALNUM.includes(c))) return 'alnum';
    return 'byte';
  }
  function segmentBits(text, mode, version) {
    const bits = [];
    const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    let count;
    if (mode === 'byte') count = utf8(text).length; else count = text.length;
    push(MODES[mode].bits, 4);
    push(count, countBits(mode, version));
    if (mode === 'numeric') for (let i = 0; i < text.length; i += 3) { const g = text.slice(i, i + 3); push(+g, g.length * 3 + 1); }
    else if (mode === 'alnum') for (let i = 0; i < text.length; i += 2) {
      if (i + 1 < text.length) push(ALNUM.indexOf(text[i]) * 45 + ALNUM.indexOf(text[i + 1]), 11);
      else push(ALNUM.indexOf(text[i]), 6);
    }
    else for (const b of utf8(text)) push(b, 8);
    return { bits, count };
  }

  // How many characters of a mode fit in a version/EC (handy for capacity lessons)
  function capacity(v, ec, mode = 'byte') {
    const avail = dataCodewords(v, ec) * 8 - 4 - countBits(mode, v);
    if (mode === 'numeric') { const g = Math.floor(avail / 10), r = avail % 10; return g * 3 + (r >= 7 ? 2 : r >= 4 ? 1 : 0); }
    if (mode === 'alnum') { const g = Math.floor(avail / 11), r = avail % 11; return g * 2 + (r >= 6 ? 1 : 0); }
    if (mode === 'kanji') return Math.floor(avail / 13);
    return Math.floor(avail / 8);
  }

  // ---- Encode ------------------------------------------------------------------------------------------
  // encode(text, { ec: 'M', mask: 'auto'|0-7, minVersion, version, mode })
  function encode(text, opts = {}) {
    text = String(text);
    const ec = opts.ec || 'M';
    if (!EC[ec]) throw new Error(`Unknown error-correction level ${ec}`);
    const mode = opts.mode || bestMode(text);
    let version = null, seg = null;
    for (let v = opts.version || opts.minVersion || 1; v <= (opts.version || 40); v++) {
      const s = segmentBits(text, mode, v);
      if (s.count < 2 ** countBits(mode, v) && s.bits.length <= dataCodewords(v, ec) * 8) { version = v; seg = s; break; }
    }
    if (!version) throw new Error(opts.version ? `Too long for version ${opts.version}-${ec}` : 'Too long for any QR code at this error-correction level');
    const capBits = dataCodewords(version, ec) * 8;
    const bits = seg.bits.slice();
    const terminator = Math.min(4, capBits - bits.length);
    for (let i = 0; i < terminator; i++) bits.push(0);
    while (bits.length % 8) bits.push(0);
    const dataLen = bits.length / 8;
    const data = [];
    for (let i = 0; i < bits.length; i += 8) data.push(bits.slice(i, i + 8).reduce((a, b) => (a << 1) | b, 0));
    for (let pad = 0xec; data.length < capBits / 8; pad ^= 0xec ^ 0x11) data.push(pad);

    // Split into blocks, add EC codewords, interleave
    const layout = blockLayout(version, ec);
    let k = 0;
    const blocks = layout.map(b => { const d = data.slice(k, (k += b.data)); return { data: d, ecc: rsEncode(d, b.ecc) }; });
    const stream = [], owner = [];
    const maxData = Math.max(...layout.map(b => b.data));
    for (let i = 0; i < maxData; i++) blocks.forEach((b, bi) => { if (i < b.data.length) { stream.push(b.data[i]); owner.push({ block: bi, index: i, ecc: false }); } });
    for (let i = 0; i < layout[0].ecc; i++) blocks.forEach((b, bi) => { stream.push(b.ecc[i]); owner.push({ block: bi, index: i, ecc: true }); });

    // Place
    const sk = skeleton(version);
    const order = placementOrder(sk);
    const codeword = new Int16Array(sk.size * sk.size).fill(-1);
    order.forEach((idx, i) => {
      const cw = i >> 3;
      if (cw < stream.length) { sk.modules[idx] = (stream[cw] >>> (7 - (i & 7))) & 1; codeword[idx] = cw; }
      else sk.role[idx] = ROLE.remainder;
    });
    const unmasked = sk.modules.slice();

    // Pick the mask with the lowest penalty unless one was asked for
    const penalties = [];
    let mask = opts.mask === 'auto' || opts.mask == null ? -1 : +opts.mask;
    for (let m = 0; m < 8; m++) {
      const trial = { ...sk, modules: unmasked.slice() };
      applyMask(trial, m); writeFormat(trial, ec, m);
      penalties.push(penalty(trial.modules, sk.size));
    }
    if (mask < 0) mask = penalties.reduce((best, p, m) => (p.total < penalties[best].total ? m : best), 0);
    applyMask(sk, mask);
    writeFormat(sk, ec, mask);

    return {
      text, version, size: sk.size, ec, mask, mode,
      modules: sk.modules, role: sk.role, codeword, unmasked,
      segments: [{ mode, count: seg.count, bits: seg.bits.length, text }],
      bits: { segment: seg.bits.length, terminator, padBits: dataLen * 8 - seg.bits.length - terminator, padBytes: data.length - dataLen, capacity: capBits },
      data, blocks, stream, owner, penalties, placement: order,
      format: formatBits(ec, mask),
    };
  }

  // ---- Decode a module grid ------------------------------------------------------------------------------
  // grid: Uint8Array/array of 0|1 (row-major) or array of rows. Returns { ok, text, steps… } or { ok:false, error, stage }.
  function decodeMatrix(grid, sizeHint) {
    let size, modules;
    if (Array.isArray(grid) && Array.isArray(grid[0])) { size = grid.length; modules = Uint8Array.from(grid.flat(), b => (b ? 1 : 0)); }
    else { modules = Uint8Array.from(grid, b => (b ? 1 : 0)); size = sizeHint || Math.round(Math.sqrt(modules.length)); }
    const version = versionOf(size);
    if (!Number.isInteger(version) || version < 1 || version > 40) return { ok: false, stage: 'size', error: `A ${size}×${size} grid isn't a QR size (21, 25, 29 … 177).` };
    const at = (x, y) => modules[y * size + x];

    // Format: try each copy, then both against all 32 valid words
    const copies = formatPositions(size).map(copy => copy.reduce((acc, [x, y], i) => acc | (at(x, y) << i), 0));
    let format = null, formatCopy = -1;
    copies.forEach((bits, i) => { const f = readFormat(bits); if (f && (!format || f.distance < format.distance)) { format = f; formatCopy = i; } });
    if (!format) return { ok: false, stage: 'format', error: 'Both copies of the format information are too damaged to read.', copies };

    const raw = readCodewords(modules, size, format.mask);
    // De-interleave
    const layout = blockLayout(version, format.ec);
    const blocks = layout.map(b => ({ data: [], ecc: [], len: b.data, n: b.ecc }));
    let p = 0;
    const maxData = Math.max(...layout.map(b => b.data));
    for (let i = 0; i < maxData; i++) blocks.forEach(b => { if (i < b.len) b.data.push(raw[p++]); });
    for (let i = 0; i < layout[0].ecc; i++) blocks.forEach(b => { b.ecc.push(raw[p++]); });

    const corrections = [];
    const data = [];
    for (let bi = 0; bi < blocks.length; bi++) {
      const b = blocks[bi], cw = b.data.concat(b.ecc);
      const fixed = rsCorrect(cw, b.n);
      if (fixed === null) return { ok: false, stage: 'ecc', error: `Block ${bi + 1} of ${blocks.length} has more damage than its ${b.n} error-correction codewords can repair.`, version, size, ec: format.ec, mask: format.mask, block: bi, raw };
      corrections.push(fixed.length);
      data.push(...cw.slice(0, b.len));
    }

    const parsed = parseSegments(data, version);
    if (!parsed.ok) return { ...parsed, version, ec: format.ec, mask: format.mask };
    return {
      ok: true, text: parsed.text, segments: parsed.segments, version, size, ec: format.ec, mask: format.mask,
      formatDistance: format.distance, formatCopy, corrections, corrected: corrections.reduce((a, b) => a + b, 0),
      capacity: corrections.map((_, i) => Math.floor(blocks[i].n / 2)), data, raw,
    };
  }

  // Unmask the data modules and read them back as codewords, in placement order
  function readCodewords(modules, size, mask) {
    const order = placementOrder(skeleton(versionOf(size)));
    const f = MASKS[mask], raw = [];
    let byte = 0;
    order.forEach((idx, i) => {
      const x = idx % size, y = Math.floor(idx / size);
      byte = (byte << 1) | (modules[idx] ^ (f(x, y) ? 1 : 0));
      if ((i & 7) === 7) { raw.push(byte); byte = 0; }
    });
    raw.length = totalCodewords(versionOf(size));
    return raw;
  }

  // Codeword errors per block, comparing a (damaged) grid against the symbol it came from
  function blockDamage(e, modules) {
    const raw = readCodewords(modules, e.size, e.mask);
    const layout = blockLayout(e.version, e.ec);
    const errors = layout.map(() => 0);
    raw.forEach((b, i) => { if (b !== e.stream[i]) errors[e.owner[i].block]++; });
    return layout.map((b, i) => ({ errors: errors[i], budget: Math.floor(b.ecc / 2), data: b.data, ecc: b.ecc }));
  }

  // The XOR pattern a mask lays over the data area (function patterns left light)
  function maskPattern(version, mask) {
    const sk = skeleton(version), out = new Uint8Array(sk.size * sk.size);
    for (let y = 0; y < sk.size; y++) for (let x = 0; x < sk.size; x++) { const i = y * sk.size + x; out[i] = !sk.fn[i] && MASKS[mask](x, y) ? 1 : 0; }
    return { version, size: sk.size, modules: out, role: sk.role };

          ? (() => { const b = h('button.btn.sm.ghost', { type: 'button', id: `qr-scan-reveal-${i}`, onclick: () => b.replaceWith(h('span', null, v)) }, 'Guess, then reveal'); return b; })()
          : h('span', null, v))));
      fill(status, h('span.chip.good', null, icon('check'), source === 'camera' ? 'Read from the camera' : 'Read from the photo'));
      const isLink = c.type === 'url' && /^https?:/i.test(c.href || '');
      const risky = c.flags.some(f => f.level === 'bad');
      fill(result, 
        h('div.grid.qr-lesson', null,
          h('section.sheet', null, h('div.sheet-head', null, h('h2', null, 'How it was read')), h('div.sheet-body.stack', null,
            plate(clean, { max: '220px', label: 'The grid the scanner sampled' }), how)),
          h('section.sheet', null, h('div.sheet-head', null, h('h2', null, 'Where it leads')), h('div.sheet-body.stack', null, leadsTo(c),
            h('div.row', null,
              isLink ? h('a', { class: `btn ${risky ? 'danger' : 'primary'}`, id: 'qr-open-link', href: c.href, target: '_blank', rel: 'noopener noreferrer' }, risky ? 'Open anyway' : 'Open link', icon('arrow')) : null,
              h('button.btn', { type: 'button', id: 'qr-scan-copy', onclick: () => Bench.copy(res.text, 'Contents copied') }, icon('copy'), 'Copy'),
              h('button.btn.ghost', { type: 'button', id: 'qr-scan-inspect', onclick: () => { setUi({ inspect: res.text }); go('inspect'); } }, 'Inspect', icon('arrow')))))),
        history());
    }

    function remember(text) {
      store.update('qr:scans', list => [{ t: text, d: today() }, ...list.filter(x => x.t !== text)].slice(0, 30), []);
    }
    function history() {
      const list = store.get('qr:scans', []);
      if (!list.length) return null;
      return h('section.sheet', null, h('div.sheet-head', null, h('h2', null, 'Recent scans'), h('div.actions', null, h('button.btn.sm.ghost', { type: 'button', id: 'qr-scans-clear', onclick: () => { store.set('qr:scans', []); result.lastChild && result.lastChild.remove(); } }, icon('trash'), 'Clear'))),
        h('ul.list', null, list.slice(0, 10).map((x, i) => {
          const c = P.classify(x.t);
          return h('li', null, h('span.chip', null, c.label), h('span.grow.title.mono', { style: { fontSize: 'var(--t-sm)' } }, x.t.length > 70 ? x.t.slice(0, 70) + '…' : x.t),
            h('span.faint', { style: { fontSize: 'var(--t-xs)' } }, x.d),
            h('button.btn.sm.ghost', { type: 'button', id: `qr-scan-h-${i}`, onclick: () => { setUi({ inspect: x.t }); go('inspect'); } }, 'Inspect'));
        })));
    }

    fill(result, history() || '');
    return [
      h('section.sheet', null, h('div.sheet-head', null, h('h2', null, 'Scan'), h('div.actions', null, camBtn,
        h('label.btn', { for: 'qr-photo' }, icon('upload'), 'Choose photo'), fileIn)),
        h('div.sheet-body.stack', null, stage, video, status,
          h('p.faint', { style: { fontSize: 'var(--t-xs)' } }, 'Everything is read here on your device; nothing is uploaded. Links never open by themselves. You see where they lead first.'))),
      result];
  }

  // ---------------------------------------------------------------- Inspect
  const EXAMPLES = [
    ['Menu link', 'https://cafe-luna.example/menu?table=12'],
    ['Short link', 'https://bit.ly/3menu-table12'],
    ['Wi-Fi', 'WIFI:T:WPA;S:Cafe Luna Guest;P:espresso-2026;;'],
    ['Parking sticker', 'http://parking-pay-verify.com/pay?zone=4'],
    ['2FA setup', 'otpauth://totp/Acme:ada@example.com?secret=JBSWY3DPEHPK3PXP&issuer=Acme'],
    ['Product', 'https://id.gs1.org/01/09506000134352'],
  ];

  function inspectTab(go) {
    const p = progress();
    const input = h('textarea.input.mono', { id: 'qr-inspect-text', rows: 3, spellcheck: 'false', value: ui().inspect, 'aria-label': 'QR contents' });
    const left = h('div.stack'), right = h('div.stack');
    const paint = () => {
      const text = input.value;
      setUi({ inspect: text });
      let e;
      try { e = Q.encode(text || ' ', { ec: 'M' }); } catch (err) { fill(left, h('div.empty', null, h('b', null, 'Too long'), err.message)); fill(right); return; }
      fill(left, plate(e, { max: '320px', label: 'Inspected code' }), coverReading(e, p));
      fill(right, leadsTo(P.classify(text)));
    };
    input.addEventListener('input', Bench.debounce(paint, 200));
    paint();
    return [
      h('section.sheet', null, h('div.sheet-head', null, h('h2', null, 'What’s inside'), h('div.actions', null, explainSeg(() => go('inspect')))),
        h('div.sheet-body.stack', null, input, h('div.row.qr-examples', null, h('span.faint', { style: { fontSize: 'var(--t-xs)' } }, 'Try:'),
          EXAMPLES.map(([name, t], i) => h('button.chip', { type: 'button', id: `qr-example-${i}`, onclick: () => { input.value = t; paint(); } }, name))),
          h('div.row', null, h('span.faint', { style: { fontSize: 'var(--t-xs)' } }, 'Have the code itself, not its text?'), h('button.btn.sm', { type: 'button', id: 'qr-to-scan', onclick: () => go('scan') }, icon('qr'), 'Scan it')))),
      h('div.grid.qr-lesson', null, h('section.sheet', null, h('div.sheet-head', null, h('h2', null, 'Cover reading')), h('div.sheet-body', null, left)),
        h('section.sheet', null, h('div.sheet-head', null, h('h2', null, 'Where it leads')), h('div.sheet-body', null, right)))];
  }

  // The facts a reader can get from the outside, explained, quizzed or just listed
  function coverReading(e, p) {
    const used = e.bits.segment, cap = e.bits.capacity;
    const facts = [
      { k: 'Version', v: `${e.version} (${e.size}×${e.size})`, skill: 'cover.version', why: `${e.size} = 17 + 4 × ${e.version}.` },
      { k: 'Error correction', v: `${e.ec} · repairs ~${Q.EC[e.ec].recover}%`, skill: 'cover.ec', why: 'Read from the format strip under the top-left finder.' },
      { k: 'Mask', v: String(e.mask), skill: 'cover.mask', why: `Chosen for the lowest penalty: ${Q.MASK_FORMULAS[e.mask]}.` },
      { k: 'Mode', v: { numeric: 'Numeric', alnum: 'Alphanumeric', byte: 'Byte (UTF-8)', kanji: 'Kanji' }[e.mode], skill: 'cover.contents', why: e.mode === 'byte' ? 'Lower-case or symbols force byte mode, 8 bits a character.' : 'A compact mode: fewer bits per character.' },
      { k: 'Fill', v: `${pct(used / cap)} of ${cap / 8} bytes`, skill: 'cover.contents', why: 'How full the version is. A bigger payload would need a bigger version.' },
    ];
    const mode = L.scaffold(p, ['cover.version', 'cover.ec', 'cover.mask', 'cover.contents'], ui().explain);
    if (mode === 'hide') return h('p.mono.qr-oneline', null, `v${e.version} · ${e.size}² · ${e.ec} · mask ${e.mask} · ${e.mode} · ${pct(used / cap)} full`);
    return h('dl.qr-facts', null, facts.map((f, i) => {
      const value = h('dd', null, f.v);
      if (mode === 'predict') {
        const btn = h('button.btn.sm.ghost', { type: 'button', id: `qr-reveal-${i}`, onclick: () => btn.replaceWith(h('span', null, f.v)) }, 'Guess, then reveal');
        fill(value, btn);
      } else value.append(h('div.faint', { style: { fontSize: 'var(--t-xs)' } }, f.why));
      return [h('dt', null, f.k, h('span.mono.faint', { title: 'Your review box' }, ' ', boxDots(L.boxOf(p, f.skill)))), value];
    }));
  }

  function leadsTo(c) {
    const worst = c.flags.some(f => f.level === 'bad') ? 'bad' : c.flags.some(f => f.level === 'warn') ? 'warn' : 'good';
    return h('div.stack', null,
      h('div.row', null, h('span', { class: `chip ${worst}` }, worst === 'good' ? icon('check') : null, c.label), h('span.faint.mono', { style: { fontSize: 'var(--t-xs)' } }, `${c.length} chars`)),
      h('p', { style: { fontWeight: 600 } }, c.action),
      c.fields.length ? h('dl.qr-facts', null, c.fields.map(([k, v]) => [h('dt', null, k), h('dd.mono', { style: { overflowWrap: 'anywhere' } }, v)])) : null,
      c.flags.length ? h('ul.list.qr-flags', null, c.flags.map(f => h('li', null, h('span', { class: `chip ${f.level === 'info' ? 'blue' : f.level}` }, f.level === 'info' ? 'Note' : f.level === 'warn' ? 'Careful' : 'Danger'), h('span.grow', null, f.msg))))
        : h('p.faint', { style: { fontSize: 'var(--t-sm)' } }, 'No warning signs. Still check the address your phone shows before you open it.'));
  }

  // ---------------------------------------------------------------- Make
  const KINDS = [
    { id: 'url', label: 'Link', fields: [['url', 'Address', 'https://']] },
    { id: 'text', label: 'Text', fields: [['text', 'Text', '', 'area']] },
    { id: 'wifi', label: 'Wi-Fi', fields: [['ssid', 'Network name', ''], ['password', 'Password', ''], ['auth', 'Security', 'WPA', ['WPA', 'WEP', 'none']]] },
    { id: 'contact', label: 'Contact', fields: [['name', 'Name', ''], ['phone', 'Phone', ''], ['email', 'Email', ''], ['org', 'Organisation', ''], ['url', 'Website', '']] },
    { id: 'email', label: 'Email', fields: [['to', 'To', ''], ['subject', 'Subject', ''], ['body', 'Message', '', 'area']] },
    { id: 'sms', label: 'SMS', fields: [['to', 'Number', ''], ['body', 'Message', '', 'area']] },
    { id: 'tel', label: 'Phone', fields: [['to', 'Number', '']] },
    { id: 'geo', label: 'Location', fields: [['lat', 'Latitude', '51.5007'], ['lng', 'Longitude', '-0.1246'], ['label', 'Label', '']] },
  ];

  function makeTab(go) {
    const st = { kind: 'url', ec: 'M', mask: 'auto', values: { url: { url: 'https://bench.example/qr' } }, ...store.get('qr:make', {}) };
    const save = () => store.set('qr:make', st);
    const form = h('div.stack'), out = h('div.stack'), kindSeg = h('div.seg', { role: 'group', 'aria-label': 'What to encode' });
    const payload = () => P.build[st.kind]({ ...Object.fromEntries(KINDS.find(k => k.id === st.kind).fields.map(([k, , def]) => [k, Array.isArray(def) ? def[0] : def])), ...(st.values[st.kind] || {}) });

    function paintForm() {
      fill(kindSeg, ...KINDS.map(k => h('button', { type: 'button', id: `qr-make-${k.id}`, 'aria-pressed': String(st.kind === k.id), onclick: () => { st.kind = k.id; save(); paintForm(); paintOut(); } }, k.label)));
      const kind = KINDS.find(k => k.id === st.kind), vals = st.values[st.kind] || (st.values[st.kind] = {});
      fill(form, ...kind.fields.map(([key, label, def, type]) => {
        const id = `qr-field-${st.kind}-${key}`;
        const set = ev => { vals[key] = ev.target.value; save(); paintOut(); };
        let ctl;
        if (Array.isArray(type)) ctl = h('select.input', { id, onchange: set }, type.map(o => h('option', { value: o, selected: (vals[key] ?? def) === o }, o === 'none' ? 'None (open)' : o)));
        else if (type === 'area') ctl = h('textarea.input', { id, rows: 3, value: vals[key] ?? def, oninput: Bench.debounce(set, 150) });
        else ctl = h('input.input', { id, value: vals[key] ?? def, oninput: Bench.debounce(set, 150), autocomplete: 'off' });
        return h('label.field', { for: id }, h('span', null, label), ctl);
      }),
      h('div.row', null,
        h('div.field', null, h('span', null, 'Error correction'), h('div.seg', { role: 'group', 'aria-label': 'Error correction' }, 'LMQH'.split('').map(x => h('button', { type: 'button', id: `qr-make-ec-${x}`, 'aria-pressed': String(st.ec === x), onclick: ev => { st.ec = x; save(); press(ev); paintOut(); } }, x)))),
        h('label.field', { for: 'qr-make-mask' }, h('span', null, 'Mask'), h('select.input', { id: 'qr-make-mask', onchange: ev => { st.mask = ev.target.value; save(); paintOut(); } },
          h('option', { value: 'auto', selected: st.mask === 'auto' }, 'Auto (lowest penalty)'), Q.MASKS.map((_, i) => h('option', { value: i, selected: String(st.mask) === String(i) }, `Mask ${i}`))))));
    }

    function paintOut() {
      const text = payload();
      let e;
      try { e = Q.encode(text || ' ', { ec: st.ec, mask: st.mask }); }
      catch (err) { fill(out, h('div.empty', null, h('b', null, 'Too long'), err.message)); return; }
      const c = P.classify(text);
      const mode = L.scaffold(progress(), ['cover.choose', 'cover.contents'], ui().explain);
      const note = mode === 'hide' ? null : h('p.faint', { style: { fontSize: 'var(--t-xs)' } },
        `${text.length} characters in ${e.mode} mode fill ${pct(e.bits.segment / e.bits.capacity)} of version ${e.version} at level ${e.ec}. ${st.ec === 'H' ? 'H leaves room for a logo.' : st.ec === 'L' ? 'L keeps it small but fragile.' : ''} Mask ${e.mask} scored ${e.penalties[e.mask].total} penalty points${st.mask === 'auto' ? ', the lowest of the eight' : ''}.`);
      fill(out, 
        plate(e, { max: '340px', label: `QR code for ${c.label}` }),
        h('div.row', null, h('span.chip', null, c.label), h('span.mono.faint', { style: { fontSize: 'var(--t-xs)' } }, `v${e.version} · ${e.size}×${e.size} · ${e.ec} · mask ${e.mask}`)),
        note,
        c.flags.filter(f => f.level !== 'info').map(f => h('div.row', null, h('span', { class: `chip ${f.level}` }, f.level === 'bad' ? 'Danger' : 'Careful'), h('span.muted', { style: { fontSize: 'var(--t-sm)' } }, f.msg))),
        h('div.row', null,
          h('button.btn.primary', { type: 'button', id: 'qr-download-png', onclick: () => downloadPng(e) }, icon('download'), 'PNG'),
          h('button.btn', { type: 'button', id: 'qr-download-svg', onclick: () => Bench.download('qr-code.svg', exportSvg(e), 'image/svg+xml') }, icon('download'), 'SVG'),
          h('button.btn.ghost', { type: 'button', id: 'qr-copy', onclick: () => Bench.copy(text, 'Contents copied') }, icon('copy'), 'Copy contents'),
          h('button.btn.ghost', { type: 'button', id: 'qr-to-inspect', onclick: () => { setUi({ inspect: text }); go('inspect'); } }, 'Inspect', icon('arrow'))));
    }
    paintForm(); paintOut();
    return [h('div.grid.qr-lesson', null,
      h('section.sheet', null, h('div.sheet-head', null, h('h2', null, 'Make a code')), h('div.sheet-body.stack', null, kindSeg, form)),
      h('section.sheet', null, h('div.sheet-head', null, h('h2', null, 'Your code')), h('div.sheet-body', null, out)))];
  }

  function exportSvg(e) {
    return '<?xml version="1.0" encoding="UTF-8"?>\n' + codeSvg(e, { label: 'QR code' })
      .replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" ')
      .replace('class="qr-off"', 'fill="#ffffff"').replace('class="qr-on"', 'fill="#000000"');
  }
  function downloadPng(e, scale = 12, quiet = 4) {
    const S = (e.size + quiet * 2) * scale;
    const c = h('canvas', { width: S, height: S }), g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, S, S); g.fillStyle = '#000';
    for (let y = 0; y < e.size; y++) for (let x = 0; x < e.size; x++) if (e.modules[y * e.size + x]) g.fillRect((x + quiet) * scale, (y + quiet) * scale, scale, scale);
    c.toBlob(b => { if (b) Bench.download('qr-code.png', b); else toast('Could not make a PNG here'); }, 'image/png');
  }

  // ---------------------------------------------------------------- page
  const TABS = [['path', 'Path'], ['learn', 'Learn'], ['scan', 'Scan'], ['inspect', 'Inspect'], ['make', 'Make']];
  function render(page) {
    const arg = Bench.takeArg();
    if (arg && typeof arg === 'object') setUi(arg);
    const tabs = h('div.tabs', { role: 'tablist' }), body = h('div.stack', { style: { gap: '22px' } });
    const go = (tab, patch = {}) => { setUi({ tab, ...patch }); paint(); window.scrollTo?.(0, 0); };
    function paint() {
      const t = ui().tab;
      fill(tabs, ...TABS.map(([id, label]) => h('button', { type: 'button', role: 'tab', id: `qr-tab-${id}`, 'aria-selected': String(t === id), onclick: () => go(id) }, label)));
      stopAll();
      const fn = { path: pathTab, learn: learnTab, scan: scanTab, inspect: inspectTab, make: makeTab }[t] || pathTab;
      fill(body, ...fn(go).flat().filter(Boolean));
    }
    const lv = L.recommendedLevel(progress());
    page.append(h('header.page-head', null,
      h('div', null, h('div.eyebrow', null, 'Learn'), h('h1', null, 'QR Codes')),
      h('div.actions', null, h('span.chip.mark', null, `Level ${lv} · ${L.LEVELS[lv - 1].title}`))), tabs, body);
    paint();
    return stopAll;
  }

  Bench.module({
    id: 'qr', title: 'QR Codes', short: 'QR', icon: 'qr', group: 'make', key: 'q',
    render,
    badge: () => { const n = L.dueSkills(progress(), today(), readySkills()).length; return n ? String(n) : ''; },
    commands: () => [
      { label: 'Continue QR lesson', run: () => Bench.navigate('qr', { tab: 'learn', level: L.recommendedLevel(progress()) }) },
      { label: 'Review due QR skills', run: () => Bench.navigate('qr', { tab: 'learn', level: 'review' }) },
      { label: 'Scan a QR code', run: () => Bench.navigate('qr', { tab: 'scan' }) },
      { label: 'Make a QR code', run: () => Bench.navigate('qr', { tab: 'make' }) },
      { label: 'Inspect QR contents', run: () => Bench.navigate('qr', { tab: 'inspect' }) },
    ],
  });
})(window.Bench);

</script>
  <script>Bench.startSolo('qr', { tagline: 'learn it, then use it', mark: '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="var(--ink)"/><g fill="none" stroke="var(--paper)" stroke-width="2"><rect x="6" y="6" width="7" height="7" rx="1"/><rect x="19" y="6" width="7" height="7" rx="1"/><rect x="6" y="19" width="7" height="7" rx="1"/></g><rect x="19" y="19" width="7" height="7" rx="1.5" fill="var(--mark)"/></svg>' });</script>
</body>
